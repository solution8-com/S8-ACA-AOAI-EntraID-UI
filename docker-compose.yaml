services:
  app:
    build:
      context: ./src
    env_file:
      - .env
    ports:
      - 50505:50505
    volumes:
      - ./src:/code
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
