name: Deploy to Azure from Github
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - copilot/add-n8n-webhook-chat-backend  

# GitHub Actions workflow to deploy to Azure using azd
# To configure required secrets for connecting to Azure, simply run `azd pipeline config`

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      # project specific
      AZURE_AUTH_TENANT_ID: ${{ vars.AZURE_AUTH_TENANT_ID }}
      AZURE_AUTH_CLIENT_ID: ${{ vars.AZURE_AUTH_CLIENT_ID }}
      AZURE_OPENAI_RESOURCE: ${{ vars.AZURE_OPENAI_RESOURCE }}
      AZURE_OPENAI_RESOURCE_GROUP: ${{ vars.AZURE_OPENAI_RESOURCE_GROUP }}
      AZURE_OPENAI_RESOURCE_GROUP_LOCATION: ${{ vars.AZURE_OPENAI_RESOURCE_GROUP_LOCATION }}
      AZURE_OPENAI_SKU_NAME: ${{ vars.AZURE_OPENAI_SKU_NAME }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      CREATE_ROLE_FOR_USER: ${{ vars.CREATE_ROLE_FOR_USER }}
      SERVICE_ACA_RESOURCE_EXISTS: ${{ vars.SERVICE_ACA_RESOURCE_EXISTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2.1.0

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          architecture: x64

      - name: Install Python requirements for hooks
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Provision Infrastructure
        run: |
          # Use existing resource group and infrastructure
          azd env set AZURE_RESOURCE_GROUP "RG-AI-Regent-DEV" --no-prompt
          azd env set AZURE_CONTAINER_REGISTRY_NAME "regentdockerregistry" --no-prompt
          azd env set AZURE_CONTAINER_APPS_ENVIRONMENT_NAME "cae-mw10" --no-prompt
          azd env set SERVICE_ACA_RESOURCE_EXISTS "true" --no-prompt
          azd env set AZURE_OPENAI_RESOURCE "cog-mw10-cohere" --no-prompt
          azd env set AZURE_OPENAI_RESOURCE_GROUP "RG-AI-Regent-DEV" --no-prompt
          azd env set AZURE_OPENAI_RESOURCE_GROUP_LOCATION "westeurope" --no-prompt
          
          # Disable automatic role creation (guest user limitation)
          azd env set CREATE_ROLE_FOR_USER false --no-prompt
          
          # Use existing App Registration for auth
          azd env set AZURE_AUTH_CLIENT_ID "${{ vars.AZURE_AUTH_CLIENT_ID }}" --no-prompt
          azd env set AZURE_AUTH_CLIENT_SECRET "${{ secrets.AZURE_AUTH_CLIENT_SECRET }}" --no-prompt
          azd env set AZURE_AUTH_TENANT_ID "${{ vars.AZURE_AUTH_TENANT_ID }}" --no-prompt
          
          azd provision --no-prompt
          
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars. AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application
        run: azd deploy --no-prompt
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
