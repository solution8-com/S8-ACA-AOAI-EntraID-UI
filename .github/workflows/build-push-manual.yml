name: Build and push image for ca-mw10-haystack

on:
  push:
    branches:
      - copilot/add-n8n-webhook-chat-backend
    paths:
      - '**'
      - '.github/workflows/ca-mw10-haystack-AutoDeployTrigger-dfdf0396-e3ec-4191-bf9c-7b550a23ea70.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: regentdockerregistry-f9aefth8aqhddxd4.azurecr.io
          username: ${{ secrets.CAMW10HAYSTACK_REGISTRY_USERNAME }}
          password: ${{ secrets.CAMW10HAYSTACK_REGISTRY_PASSWORD }}

      # IMPORTANT: Adjust context/file paths to match your repo layout.
      # If your Dockerfile is at src/Dockerfile, keep context: ./src and file: ./src/Dockerfile.
      # If your Dockerfile is at repo root, use context: . and file: ./Dockerfile instead.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            regentdockerregistry-f9aefth8aqhddxd4.azurecr.io/ca-mw10-haystack:${{ github.sha }}
            regentdockerregistry-f9aefth8aqhddxd4.azurecr.io/ca-mw10-haystack:latest
          # Optional: pass build args if needed
          # build-args: |
          #   ARG_NAME=${{ secrets.SOME_SECRET }}
